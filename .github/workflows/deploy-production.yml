name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_ENV: testing
  APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  CRON_KEY: ci-placeholder-key
  SUMUP_API_KEY: ci-placeholder-key
  SUMUP_MERCHANT_CODE: ci-placeholder-merchant

jobs:
  deploy:
    name: Deploy to erd-gut.de
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # Increased from 20 to 35: vendor extraction on IONOS can take 10–15 min
    # on first deploy after a dependency change. Most deploys skip it entirely
    # (hash match) and finish in well under 10 min.
    timeout-minutes: 35
    env:
      APP_DIR: ${{ secrets.PRODUCTION_SERVER_DIR }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install npm dependencies and build assets
        run: npm install && npm run build

      - name: Validate SSH deploy secrets
        run: |
          test -n "$SSH_HOST"    || (echo "Missing SSH_HOST secret"              && exit 1)
          test -n "$SSH_USERNAME" || (echo "Missing SSH_USERNAME secret"         && exit 1)
          test -n "$SSH_PASSWORD" || (echo "Missing SSH_PASSWORD secret"         && exit 1)
          test -n "$APP_DIR"     || (echo "Missing PRODUCTION_SERVER_DIR secret" && exit 1)

      # App archive: everything except vendor (which has its own archive).
      # Excluding vendor keeps this archive small (~5–15 MB) so extraction
      # on IONOS finishes in seconds regardless of hosting I/O speed.
      - name: Create app archive (without vendor)
        run: |
          tar -czf /tmp/release.tar.gz \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=vendor \
            --exclude=tests \
            --exclude=scripts \
            --exclude=.env \
            --exclude=README.md \
            --exclude=DEPLOYMENT.md \
            --exclude=index.html \
            .
          mv /tmp/release.tar.gz .

      # Vendor archive: only the vendor/ directory.
      # This is large (~60 MB compressed) but is only extracted on the server
      # when composer.lock changed. We always upload it; extraction is skipped
      # via a hash check in the extract step.
      - name: Create vendor archive
        run: tar -czf vendor.tar.gz vendor/

      # Hash used server-side to decide whether to extract vendor.
      # File is suffixed -production so staging and production (which share
      # the same server home directory ~/), don't overwrite each other's
      # hash and accidentally skip vendor extraction on the other env.
      - name: Compute composer.lock hash
        run: md5sum composer.lock | cut -d' ' -f1 > vendor_lock_hash_new.txt

      - name: Upload archives and hash via SCP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          password: ${{ env.SSH_PASSWORD }}
          source: "release.tar.gz,vendor.tar.gz,vendor_lock_hash_new.txt"
          target: ~/

      - name: Extract archives on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          password: ${{ env.SSH_PASSWORD }}
          # 30 min: worst-case is first deploy after a dep update. Normal
          # deploys (no composer.lock change) finish in under 2 min.
          command_timeout: 30m
          script: |
            set -e
            mkdir -p "${{ env.APP_DIR }}"

            # Guard: fail fast with a clear message if the SCP upload silently
            # dropped the files (known transient issue with appleboy/scp-action
            # on IONOS). Without this the cryptic "tar: cannot open" message
            # is the only signal. Just re-run the workflow if this fires.
            test -f ~/release.tar.gz      || (echo "UPLOAD MISSING: release.tar.gz not found in ~/. Re-run the workflow." && exit 1)
            test -f ~/vendor.tar.gz       || (echo "UPLOAD MISSING: vendor.tar.gz not found in ~/. Re-run the workflow." && exit 1)
            test -f ~/vendor_lock_hash_new.txt || (echo "UPLOAD MISSING: vendor_lock_hash_new.txt not found in ~/. Re-run the workflow." && exit 1)

            # Always extract the app code (small, fast).
            tar -xzf ~/release.tar.gz -C "${{ env.APP_DIR }}"
            rm -f ~/release.tar.gz

            # Only extract vendor when composer.lock changed.
            # Uses env-suffixed filenames so staging and production (same
            # server, shared ~/) can't cross-contaminate their hash state.
            NEW_HASH=$(cat ~/vendor_lock_hash_new.txt)
            OLD_HASH=$(cat ~/vendor_lock_hash_deployed_production.txt 2>/dev/null || echo "none")

            if [ "$NEW_HASH" != "$OLD_HASH" ]; then
              echo "composer.lock changed — extracting vendor (this may take a while)..."
              tar -xzf ~/vendor.tar.gz -C "${{ env.APP_DIR }}"
              cp ~/vendor_lock_hash_new.txt ~/vendor_lock_hash_deployed_production.txt
              echo "Vendor extraction complete."
            else
              echo "composer.lock unchanged — skipping vendor extraction."
            fi

            rm -f ~/vendor.tar.gz ~/vendor_lock_hash_new.txt

      - name: Run post-deploy steps on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          password: ${{ env.SSH_PASSWORD }}
          command_timeout: 10m
          script: |
            set -e
            cd "${{ env.APP_DIR }}"
            test -f artisan || (echo "Missing artisan in ${APP_DIR}" && exit 1)

            # Clear bootstrap caches BEFORE migrate so the migrate command
            # itself doesn't run against a stale cached config / route /
            # view set. `optimize:clear` covers config, route, view, event
            # and compiled-class caches in one go. Skipping this step has
            # caused at least one prod outage (2026-05-08) where stale
            # caches kept hanging requests until the next deploy
            # implicitly recompiled them.
            php artisan optimize:clear

            php artisan migrate --force

            # Idempotently (firstOrCreate) seed the default product
            # subcategories so the shop/admin subcategory pickers are
            # populated. Safe to re-run on every deploy.
            php artisan db:seed --class=ProductSubcategorySeeder --force

            php artisan storage:link --force

            # Boot smoke test: `artisan about` exercises the full service
            # provider tree + config + autoload classmap. If a controller
            # / model / observer can't be loaded, this fails and the
            # deploy is marked red — instead of silently leaving the site
            # half-broken until a customer hits the bad code path.
            php artisan about > /dev/null

            # Rebuild bootstrap caches the `optimize:clear` step wiped.
            # Without this, every customer request after a deploy pays
            # the cold-boot cost: fresh blade compilation, raw config-
            # file reads on every request, full service-provider boot.
            # Symptom (2026-05-08) was a global app slowdown across all
            # customer-facing pages until the next deploy or a manual
            # cache rebuild.
            #
            # `route:cache` is intentionally skipped: routes/web.php
            # contains closure redirects (the legacy /onboard URLs in
            # the auth-app prefix block) that are not cacheable. Move
            # those to `Route::redirect(...)` or a controller method
            # before adding the route cache.
            php artisan config:cache
            php artisan view:cache

            # Invalidate PHP-FPM's opcache for every changed PHP file.
            # IONOS shared hosting runs opcache with
            # `validate_timestamps=0` (or a long revalidate window) for
            # performance — without an explicit nudge, PHP-FPM workers
            # keep serving previously compiled bytecode, so changes
            # made by this deploy (config cache, controllers, services,
            # …) won't take effect at request time even though `php
            # artisan` (which runs CLI-side and bypasses FPM opcache)
            # sees the new code.
            #
            # Touching every project PHP file is the cheapest sweep on
            # shared hosting where we can't call `opcache_reset()` from
            # CLI. Vendor + node_modules excluded — composer install
            # already extracted those at the right mtimes.
            #
            # Symptoms that forced this in (2026-05-19):
            #   - IONOS HTTP cron rejected /cron/run for days because
            #     the bootstrap config cache held a stale CRON_KEY.
            #   - The cron heartbeat log line didn't appear after deploy
            #     because the controller class bytecode was still the
            #     pre-heartbeat version.
            find . -name '*.php' \
                -not -path './vendor/*' \
                -not -path './node_modules/*' \
                -not -path './storage/framework/*' \
                -exec touch {} +

      - name: Public URL health check
        run: |
          # Hit the public /up endpoint from outside so a CDN / DNS /
          # PHP-FPM issue is also caught. Retries 3x because IONOS
          # occasionally takes a moment to pick up the new release.
          for i in 1 2 3; do
            if curl -fsS --max-time 15 https://erd-gut.de/up > /dev/null; then
              echo "erd-gut.de healthy"
              exit 0
            fi
            echo "attempt $i failed, retrying..."
            sleep 5
          done
          echo "erd-gut.de failed health check after deploy" >&2
          exit 1
