name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to erd-gut.de
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install npm dependencies and build assets
        run: npm install && npm run build

      - name: Deploy via SFTP
        uses: wangyucode/sftp-upload-action@v3
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          localDir: './'
          remoteDir: ${{ secrets.PRODUCTION_SERVER_DIR }}
          exclude: '.git/**,.github/**,node_modules/**,tests/**,.env,.env.*,README.md,DEPLOYMENT.md,.gitignore'

      - name: Run migrations over SSH (optional)
        if: ${{ secrets.SSH_HOST != '' && secrets.SSH_USERNAME != '' && secrets.SSH_PASSWORD != '' && secrets.PRODUCTION_SERVER_DIR != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || '22' }}
          script: |
            cd "${{ secrets.PRODUCTION_SERVER_DIR }}"
            php artisan migrate --force

      - name: Run migrations over HTTP trigger (optional fallback)
        if: ${{ secrets.PRODUCTION_MIGRATE_URL != '' }}
        run: curl --fail --silent --show-error "${{ secrets.PRODUCTION_MIGRATE_URL }}"
