name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_ENV: testing
  APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  CRON_KEY: ci-placeholder-key
  SUMUP_API_KEY: ci-placeholder-key
  SUMUP_MERCHANT_CODE: ci-placeholder-merchant

jobs:
  deploy:
    name: Deploy to erd-gut.de
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_DIR: ${{ secrets.PRODUCTION_SERVER_DIR }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install npm dependencies and build assets
        run: npm install && npm run build

      - name: Validate SSH deploy secrets
        run: |
          test -n "$SSH_HOST" || (echo "Missing SSH_HOST secret" && exit 1)
          test -n "$SSH_USERNAME" || (echo "Missing SSH_USERNAME secret" && exit 1)
          test -n "$SSH_PASSWORD" || (echo "Missing SSH_PASSWORD secret" && exit 1)
          test -n "$APP_DIR" || (echo "Missing PRODUCTION_SERVER_DIR secret" && exit 1)

      - name: Create deployment archive
        run: |
          tar -czf /tmp/release.tar.gz \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=tests \
            --exclude=.env \
            --exclude=README.md \
            --exclude=DEPLOYMENT.md \
            --exclude=index.html \
            .
          mv /tmp/release.tar.gz .

      - name: Upload archive via SCP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          password: ${{ env.SSH_PASSWORD }}
          source: release.tar.gz
          target: ~/

      - name: Extract archive on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          password: ${{ env.SSH_PASSWORD }}
          script: |
            set -e
            mkdir -p "${{ env.APP_DIR }}"
            tar -xzf ~/release.tar.gz -C "${{ env.APP_DIR }}"
            rm -f ~/release.tar.gz

      - name: Run post-deploy migrations on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          password: ${{ env.SSH_PASSWORD }}
          script: |
            set -e
            cd "${{ env.APP_DIR }}"
            test -f artisan || (echo "Missing artisan in ${APP_DIR}" && exit 1)
            php artisan migrate --force
            php artisan storage:link --force
