name: Deploy to Staging

on:
  push:
    branches: [staging]

jobs:
  deploy:
    name: Deploy to staging.erd-gut.de
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_DIR: ${{ secrets.STAGING_SERVER_DIR }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install npm dependencies and build assets
        run: npm install && npm run build

      - name: Validate SSH deploy secrets
        run: |
          test -n "$SSH_HOST" || (echo "Missing SSH_HOST secret" && exit 1)
          test -n "$SSH_USERNAME" || (echo "Missing SSH_USERNAME secret" && exit 1)
          test -n "$SSH_PASSWORD" || (echo "Missing SSH_PASSWORD secret" && exit 1)
          test -n "$APP_DIR" || (echo "Missing STAGING_SERVER_DIR secret" && exit 1)

      - name: Create deployment archive
        run: |
          tar --warning=no-file-changed -czf release.tar.gz \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=tests \
            --exclude=.env \
            --exclude=README.md \
            --exclude=DEPLOYMENT.md \
            --exclude=release.tar.gz \
            .

      - name: Upload archive via SCP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          password: ${{ env.SSH_PASSWORD }}
          source: release.tar.gz
          target: ~/

      - name: Extract archive on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          password: ${{ env.SSH_PASSWORD }}
          script: |
            set -e
            mkdir -p "${{ env.APP_DIR }}"
            tar -xzf ~/release.tar.gz -C "${{ env.APP_DIR }}"
            rm -f ~/release.tar.gz
