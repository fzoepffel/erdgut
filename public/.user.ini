; PHP-FPM per-directory config for the Laravel public document root.
; PHP merges this with the global php.ini at request time.
;
; ─── OPcache (production) ────────────────────────────────────────────
; IONOS Web Hosting Plus ships PHP 8.3 with the OPcache extension
; loaded but disabled by default. Without OPcache every request
; reparses every PHP file in Laravel's vendor tree (~600 files),
; which pushed customer page-load times into the 3-7 second range.
; Enabling OPcache drops Laravel's internal request time to ~58ms.
; Diagnosed 2026-05-08.
;
; Settings are conservative for shared hosting:
;   memory_consumption    128 MB (fits Laravel + vendor + headroom).
;   max_accelerated_files 10000 (Laravel + vendor is ~6000 files).
;   validate_timestamps + revalidate_freq=2: re-check file mtimes
;     every 2 seconds so deploys pick up new code automatically.
;   enable_cli=0: artisan / queue / scheduler don't benefit from
;     across-invocation cache state.

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.validate_timestamps=1
opcache.revalidate_freq=2

; ─── Error display (defense in depth) ────────────────────────────────
; Keep deprecation / strict warnings out of rendered HTML in any env.
; Production already runs APP_DEBUG=false; this is a belt-and-braces
; layer for cases where the PHP runtime itself emits deprecation
; notices (e.g. PDO::MYSQL_ATTR_SSL_CA on PHP 8.5+).

display_errors = 0
error_reporting = 22527
